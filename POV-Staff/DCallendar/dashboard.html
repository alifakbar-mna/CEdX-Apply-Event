<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Pelaksanaan Event - Full White BG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Scrollbar untuk Panel Detail kanan */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #ffffff;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #fed7aa;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #f97316;
    }
    /* Efek transisi halus saat ganti bulan kalender */
    .fade-in-panel {
      animation: fadeInSmooth 0.3s ease-out;
    }
    @keyframes fadeInSmooth {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-white min-h-screen p-4 md:p-6 font-sans antialiased text-slate-800">

  <!-- CONTAINER UTAMA DENGAN BACKGROUND FULL PUTIH -->
  <div class="max-w-7xl mx-auto bg-white overflow-hidden">
    
    <!-- Breadcrumb Navigasi Atas -->
    <div class="px-2 py-3 flex items-center gap-2 text-xs font-medium text-slate-400 mb-4">
      <span class="text-orange-600 hover:underline cursor-pointer">My Activity</span>
      <span>/</span>
      <span class="text-orange-600 hover:underline cursor-pointer">Competition</span>
      <span>/</span>
      <span class="text-slate-400">Monitoring Event Approved</span>
    </div>

    <!-- MAIN GRID SYSTEM (KALENDER & DAFTAR AGENDA) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[650px]">
      
      <!-- PANEL KIRI: KALENDER GRID 6 BULAN (8 KOLOM) -->
      <div class="lg:col-span-8 bg-white">
        
        <!-- Header Judul Kalender & Dropdown Bulan/Tahun -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 mb-4">
          <div>
            <h2 class="text-lg font-extrabold text-slate-900 tracking-tight flex items-center gap-2.5">
              <span class="w-2.5 h-5 bg-orange-500 rounded inline-block"></span>
              Kalender Pelaksanaan Event
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">Hanya menampilkan agenda kegiatan yang telah disetujui (<span class="text-orange-600 font-semibold">Approved</span>)</p>
          </div>
          
          <!-- Filter Dropdown Atas -->
          <div class="flex items-center gap-1.5 bg-orange-50/50 p-1 rounded-xl border border-orange-100/70">
            <select id="filterBulan" onchange="renderCalendarEngine()" class="bg-white text-xs font-bold text-slate-700 rounded-lg px-2.5 py-1.5 shadow-sm focus:outline-none cursor-pointer border border-orange-100">
              <option value="0">Januari</option>
              <option value="1">Februari</option>
              <option value="2">Maret</option>
              <option value="3">April</option>
              <option value="4">Mei</option>
              <option value="5">Juni</option>
              <option value="6">Juli</option>
              <option value="7">Agustus</option>
              <option value="8">September</option>
              <option value="9" selected>Oktober</option>
              <option value="10">November</option>
              <option value="11">Desember</option>
            </select>
            <select id="filterTahun" onchange="renderCalendarEngine()" class="bg-white text-xs font-bold text-slate-700 rounded-lg px-2.5 py-1.5 shadow-sm focus:outline-none cursor-pointer border border-orange-100">
            </select>
          </div>
        </div>

        <!-- Info Indikator Klik -->
        <div class="flex items-center gap-3 text-[11px] font-medium text-slate-600 mb-5 bg-orange-50/40 border border-orange-100/60 p-2.5 rounded-xl">
          <span class="w-2 h-2 bg-orange-400 rounded-full"></span>
          <span>Hari Pelaksanaan Event</span>
          <span class="w-1.5 h-1.5 bg-slate-300 rounded-full mx-1"></span>
          <span class="text-slate-400 font-normal">*Klik kotak bulan untuk memfilter detail di sebelah kanan</span>
        </div>

        <!-- Container Grid 6 Kotak Bulan -->
        <div id="calendarGridContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        </div>
      </div>

      <!-- PANEL KANAN: DETAIL DATA DAFTAR AGENDA (4 KOLOM) -->
      <div class="lg:col-span-4 bg-white border-l border-gray-100 pl-0 lg:pl-6 pt-6 lg:pt-0 flex flex-col justify-between">
        
        <div>
          <div class="pb-3 mb-4">
            <span class="text-[10px] uppercase font-bold tracking-widest text-orange-400 block mb-0.5">Daftar Agenda</span>
            <h3 id="panelDetailTitle" class="text-base font-bold text-slate-800 tracking-tight">Memuat Data...</h3>
          </div>

          <!-- List Container Card Event -->
          <div id="panelDetailList" class="space-y-3 max-h-[480px] overflow-y-auto pr-1 custom-scrollbar fade-in-panel">
          </div>
        </div>

        <!-- Footer Sistem -->
        <div class="pt-4 border-t border-gray-100 text-[11px] text-slate-400 font-medium flex justify-between items-center mt-6">
          <span>CIS Monitoring System</span>
          <span class="font-mono bg-orange-50 text-orange-600 px-1.5 py-0.5 rounded text-[10px] font-bold">v2.2</span>
        </div>

      </div>

    </div>
  </div>

  <!-- JAVASCRIPT CORE ENGINE -->
  <script>
    const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    
    // --- DATA AGENDA ---
    const approvedEvents = [
      {
        judul: "UC Choir Concert: Symphonic Night",
        organizer: "UKM Choir",
        start: "2023-10-03",
        end: "2023-10-07"
      },
      {
        judul: "Grand Opening CIS Festival 2023",
        organizer: "Student Union Ciputra",
        start: "2023-10-07",
        end: "2023-10-10"
      },
      {
        judul: "Business Plan Pitching Day",
        organizer: "ISB Laboratory",
        start: "2023-10-07",
        end: "2023-10-07"
      },
      {
        judul: "National Seminar: Tech Innovation",
        organizer: "FIKOM Universitas Ciputra",
        start: "2023-11-12",
        end: "2023-11-14"
      },
      {
        judul: "Informatics Internal Hackathon",
        organizer: "HIMA IMT",
        start: "2024-01-20",
        end: "2024-01-25"
      },
      {
        judul: "Industrial Gathering & Awarding",
        organizer: "BMA Ciputra",
        start: "2024-03-05",
        end: "2024-03-05"
      }
    ];

    let selectedActiveMonth = null;
    let selectedActiveYear = null;

    // Generate Dropdown Tahun Otomatis
    function setupYearDropdownAutomated() {
      const filterTahunSelect = document.getElementById('filterTahun');
      let semuaTahun = [];
      approvedEvents.forEach(ev => {
        semuaTahun.push(new Date(ev.start).getFullYear(), new Date(ev.end).getFullYear());
      });

      let tahunUnik = [...new Set(semuaTahun)].sort((a, b) => a - b);
      filterTahunSelect.innerHTML = "";
      
      tahunUnik.forEach(tahun => {
        let option = document.createElement('option');
        option.value = tahun;
        option.innerText = tahun;
        if(tahun === 2023) option.selected = true;
        filterTahunSelect.appendChild(option);
      });
    }

    // Engine Render Kalender Grid 6 Bulan
    function renderCalendarEngine() {
      const startMonth = parseInt(document.getElementById('filterBulan').value);
      const startYear = parseInt(document.getElementById('filterTahun').value);
      const gridContainer = document.getElementById('calendarGridContainer');
      
      gridContainer.innerHTML = "";

      if (selectedActiveMonth === null) {
        selectedActiveMonth = startMonth;
        selectedActiveYear = startYear;
      }

      for (let i = 0; i < 6; i++) {
        let currentMonth = (startMonth + i) % 12;
        let yearOffset = Math.floor((startMonth + i) / 12);
        let currentYear = startYear + yearOffset;

        let firstDayIndex = new Date(currentYear, currentMonth, 1).getDay(); 
        let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate(); 
        let adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

        const isSelectedBox = (currentMonth === selectedActiveMonth && currentYear === selectedActiveYear);
        const activeBoxClass = isSelectedBox 
          ? "ring-2 ring-orange-500 border-orange-500 bg-orange-50/10 shadow-sm" 
          : "border-slate-100 bg-white hover:border-orange-200 shadow-sm transition duration-150";

        const monthBox = document.createElement('div');
        monthBox.className = `border rounded-xl p-3.5 cursor-pointer flex flex-col justify-between ${activeBoxClass}`;
        monthBox.setAttribute('onclick', `updateDetailPanel(${currentMonth}, ${currentYear})`);

        let htmlContent = `
          <div>
            <h3 class="text-center font-bold ${isSelectedBox ? 'text-orange-700 bg-orange-50/80' : 'text-slate-700 bg-slate-50'} text-xs tracking-wide mb-2.5 border-b border-slate-100 pb-1 rounded py-0.5">${namaBulan[currentMonth]} ${currentYear}</h3>
            <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-bold text-slate-400 mb-1.5">
              <div>S</div><div>S</div><div>R</div><div>K</div><div>J</div><div>S</div><div>M</div>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold">
        `;

        for (let x = 0; x < adjustedFirstDay; x++) {
          htmlContent += `<div class="p-1 text-transparent select-none">-</div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
          let formatBulan = String(currentMonth + 1).padStart(2, '0');
          let formatHari = String(day).padStart(2, '0');
          let currentTanggalStr = `${currentYear}-${formatBulan}-${formatHari}`;

          let activeEventsCount = approvedEvents.filter(ev => {
            return currentTanggalStr >= ev.start && currentTanggalStr <= ev.end;
          }).length;

          let dayStyle = "text-slate-600 hover:bg-orange-50 hover:text-orange-600 rounded p-1";
          let badgeHTML = "";

          if (activeEventsCount === 1) {
            dayStyle = "bg-orange-500 text-white rounded relative p-1 font-bold shadow-sm";
          } else if (activeEventsCount > 1) {
            dayStyle = "bg-orange-700 text-white rounded relative p-1 font-bold shadow-sm";
            badgeHTML = `<span class="absolute -bottom-0.5 -right-0.5 text-[7px] bg-amber-400 text-slate-950 font-black px-0.5 rounded-sm scale-90 font-mono">${activeEventsCount}</span>`;
          }

          htmlContent += `
            <div class="${dayStyle}">
              ${day}
              ${badgeHTML}
            </div>
          `;
        }

        htmlContent += `</div></div>`;
        monthBox.innerHTML = htmlContent;
        gridContainer.appendChild(monthBox);
      }

      executeRenderDetails();
    }

    function updateDetailPanel(mIndex, yValue) {
      selectedActiveMonth = mIndex;
      selectedActiveYear = yValue;
      renderCalendarEngine();
    }

    // Render List Detail Samping Kanan
    function executeRenderDetails() {
      document.getElementById('panelDetailTitle').innerText = `${namaBulan[selectedActiveMonth]} ${selectedActiveYear}`;
      const listContainer = document.getElementById('panelDetailList');
      listContainer.innerHTML = "";

      let filtered = approvedEvents.filter(ev => {
        let evStart = new Date(ev.start);
        let evEnd = new Date(ev.end);
        let targetStart = new Date(selectedActiveYear, selectedActiveMonth, 1);
        let targetEnd = new Date(selectedActiveYear, selectedActiveMonth + 1, 0);
        return (evStart <= targetEnd && evEnd >= targetStart);
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-10 px-4 bg-white rounded-xl border border-dashed border-slate-200 text-slate-400">
            <span class="text-xl block mb-1">🍁</span>
            <p class="text-[11px] font-medium">Tidak ada pelaksanaan agenda event pada bulan ini.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(ev => {
        let dStart = new Date(ev.start).getDate();
        let dEnd = new Date(ev.end).getDate();
        let displayDateText = dStart === dEnd ? `${dStart} ${namaBulan[selectedActiveMonth]}` : `${dStart} - ${dEnd} ${namaBulan[selectedActiveMonth]}`;

        let cardHTML = `
          <div class="bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm hover:shadow-md hover:border-orange-200 transition duration-200 border-l-4 border-l-orange-500">
            <span class="inline-block text-[10px] font-bold text-orange-700 bg-orange-50 px-2 py-0.5 rounded-full mb-1.5">🗓️ ${displayDateText}</span>
            <h4 class="text-xs font-bold text-slate-900 leading-snug mb-1.5">${ev.judul}</h4>
            <div class="flex items-center gap-1 text-[11px] text-slate-500 pt-1.5 border-t border-slate-50">
              <span class="text-slate-400">By:</span>
              <span class="font-semibold text-slate-700">${ev.organizer}</span>
            </div>
          </div>
        `;
        listContainer.innerHTML += cardHTML;
      });
    }

    window.onload = function() {
      setupYearDropdownAutomated();
      renderCalendarEngine();
    };
  </script>
</body>
</html>
